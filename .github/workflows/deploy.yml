name: Deploy ReelCut

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-reelcut
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify export
        run: |
          test -f out/index.html || { echo "missing out/index.html"; exit 1; }
          grep -q "main-content" out/index.html || { echo "missing main landmark"; exit 1; }
          echo "Export contains $(find out -name '*.html' | wc -l) pages."

      # The site is published in two ways, because the Pages source is decided by a
      # repository setting that the workflow cannot see:
      #
      #   Source = GitHub Actions          -> published by the `deploy` job below
      #   Source = Deploy from a branch    -> published from the `gh-pages` branch
      #
      # This way the site comes up regardless of which option is selected.
      - name: Publish to the gh-pages branch
        run: |
          cp CNAME out/CNAME 2>/dev/null || true
          touch out/.nojekyll
          cd out
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "build: $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:gh-pages
          echo "gh-pages branch updated."

      - uses: actions/configure-pages@v5
        continue-on-error: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    # Do not fail the deployment when the Pages source is a branch rather than
    # Actions - in that setup `gh-pages` already publishes the site.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
